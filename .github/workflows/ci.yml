name: Production quality gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: pip install pip-audit
      - run: ruff check app tests
      - run: mypy app
      - run: pytest
      - run: pip-audit

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  live-mysql-migration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: realestate_crm_ci
          MYSQL_USER: crm_ci
          MYSQL_PASSWORD: ci-database-password
          MYSQL_ROOT_PASSWORD: ci-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent --host=127.0.0.1 --user=root --password=ci-root-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      DATABASE_URL: mysql+asyncmy://crm_ci:ci-database-password@127.0.0.1:3306/realestate_crm_ci
      JWT_SECRET_KEY: ci-only-signing-key-with-more-than-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e .
      - run: alembic upgrade head
      - run: test "$(alembic heads | awk '{print $1}')" = "$(alembic current | awk '{print $1}')"
      - run: alembic check
      - name: Verify database backup and restore
        working-directory: .
        run: |
          docker exec "${{ job.services.mysql.id }}" mysqldump --user=root --password=ci-root-password --single-transaction realestate_crm_ci > /tmp/estateops-ci.sql
          docker exec "${{ job.services.mysql.id }}" mysql --user=root --password=ci-root-password -e 'CREATE DATABASE realestate_crm_restore CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci'
          docker exec --interactive "${{ job.services.mysql.id }}" mysql --user=root --password=ci-root-password realestate_crm_restore < /tmp/estateops-ci.sql
          test "$(docker exec "${{ job.services.mysql.id }}" mysql --batch --skip-column-names --user=root --password=ci-root-password realestate_crm_restore -e 'SELECT COUNT(*) FROM alembic_version')" = "1"

  container-build:
    runs-on: ubuntu-latest
    needs: [backend, frontend, live-mysql-migration]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          load: true
          target: runtime
          tags: estateops-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          load: true
          target: runner
          tags: estateops-frontend:ci
          build-args: NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: estateops-backend:ci
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
      - uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: estateops-frontend:ci
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

  compose-smoke:
    runs-on: ubuntu-latest
    needs: [backend, frontend, live-mysql-migration]
    env:
      APP_ENV: test
      MYSQL_DATABASE: realestate_crm_smoke
      MYSQL_USER: crm_smoke
      MYSQL_PASSWORD: smoke-database-password
      MYSQL_ROOT_PASSWORD: smoke-root-password
      REDIS_PASSWORD: smoke-redis-password
      JWT_SECRET_KEY: smoke-only-signing-key-with-more-than-32-characters
      BACKEND_PORT: "8000"
      FRONTEND_PORT: "3000"
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the isolated stack
        run: docker compose up --build --detach --wait --wait-timeout 300
      - name: Verify migration, empty database, health and public frontend
        run: |
          test "$(docker compose ps --all migrate --format '{{.ExitCode}}')" = "0"
          docker compose exec --no-TTY backend python -m app.deployment_checks assert-empty
          curl --fail --silent http://127.0.0.1:8000/health/ready
          curl --fail --silent http://127.0.0.1:3000/login > /dev/null
      - name: Verify MySQL and Redis persistence across restart
        run: |
          docker compose exec --no-TTY redis sh -c 'REDISCLI_AUTH="$REDIS_PASSWORD" redis-cli SET smoke:persistence ok'
          docker compose restart mysql redis
          docker compose up --detach --wait --wait-timeout 180
          docker compose exec --no-TTY backend python -m app.deployment_checks assert-empty
          test "$(docker compose exec --no-TTY redis sh -c 'REDISCLI_AUTH="$REDIS_PASSWORD" redis-cli GET smoke:persistence')" = "ok"
      - name: Collect failure logs
        if: failure()
        run: docker compose logs --no-color
      - name: Remove isolated volumes
        if: always()
        run: docker compose down --volumes --remove-orphans
