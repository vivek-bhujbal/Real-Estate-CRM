name: realestate-crm

x-backend-environment: &backend-environment
  APP_ENV: ${APP_ENV:-development}
  DATABASE_URL: mysql+asyncmy://${MYSQL_USER:?Set MYSQL_USER in .env}:${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}@mysql:3306/${MYSQL_DATABASE:-realestate_crm}
  REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@redis:6379/0
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
  JWT_ISSUER: ${JWT_ISSUER:-realestate-crm-api}
  JWT_AUDIENCE: ${JWT_AUDIENCE:-realestate-crm-web}
  ACCESS_TOKEN_TTL_MINUTES: ${ACCESS_TOKEN_TTL_MINUTES:-15}
  REFRESH_TOKEN_IDLE_DAYS: ${REFRESH_TOKEN_IDLE_DAYS:-7}
  REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
  PASSWORD_RESET_TTL_MINUTES: ${PASSWORD_RESET_TTL_MINUTES:-30}
  PASSWORD_RESET_DELIVERY: ${PASSWORD_RESET_DELIVERY:-disabled}
  PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-http://localhost:3000}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
  SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
  ALLOW_ORGANIZATION_REGISTRATION: ${ALLOW_ORGANIZATION_REGISTRATION:-true}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
  STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
  STORAGE_LOCAL_PATH: /app/uploads
  STORAGE_TEMP_PATH: /tmp/estateops-object-cache
  S3_BUCKET: ${S3_BUCKET:-}
  S3_REGION: ${S3_REGION:-}
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
  S3_SERVER_SIDE_ENCRYPTION: ${S3_SERVER_SIDE_ENCRYPTION:-AES256}
  S3_KMS_KEY_ID: ${S3_KMS_KEY_ID:-}
  MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
  MALWARE_SCAN_MODE: ${MALWARE_SCAN_MODE:-disabled}
  CLAMAV_HOST: ${CLAMAV_HOST:-}
  CLAMAV_PORT: ${CLAMAV_PORT:-3310}
  CLAMAV_TIMEOUT_SECONDS: ${CLAMAV_TIMEOUT_SECONDS:-30}
  METRICS_ENABLED: ${METRICS_ENABLED:-true}
  METRICS_BEARER_TOKEN: ${METRICS_BEARER_TOKEN:-}

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-realestate_crm}
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - crm-network
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping --silent --host=127.0.0.1 --user=root --password="$${MYSQL_ROOT_PASSWORD}"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}"
    volumes:
      - redis-data:/data
    networks:
      - crm-network
    healthcheck:
      test:
        - CMD-SHELL
        - REDISCLI_AUTH="$${REDIS_PASSWORD}" redis-cli ping | grep PONG
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  migrate:
    build:
      context: ./backend
      target: runtime
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment: *backend-environment
    networks:
      - crm-network
    depends_on:
      mysql:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      target: runtime
    restart: unless-stopped
    environment: *backend-environment
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - uploads:/app/uploads
    networks:
      - crm-network
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  unit-hold-expiry-worker:
    build:
      context: ./backend
      target: runtime
    restart: unless-stopped
    command: ["python", "-m", "app.workers.unit_hold_expiry"]
    environment:
      <<: *backend-environment
      UNIT_HOLD_EXPIRY_INTERVAL_SECONDS: ${UNIT_HOLD_EXPIRY_INTERVAL_SECONDS:-30}
    volumes:
      - uploads:/app/uploads
    networks:
      - crm-network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -m
        - app.workers.healthcheck
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      target: runner
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    networks:
      - crm-network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/login').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

networks:
  crm-network:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
  uploads:
